<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Login | Property Listings</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&family=Inter:wght@400;600;700&display=swap"
    />
    <!-- Stylesheets -->
    <link rel="stylesheet" href="css/styles.css" />
    <link rel="stylesheet" href="css/animations.css" />
  </head>
  <body>
    <!-- Navbar: built by js/main.js -->
    <header id="site-nav"></header>
    <!-- Page content -->
    <main class="wrap">
      <!-- ===== Section: Welcome back ===== -->
      <section class="split">
        <div class="ph mask">
          <img
            src="assets/images/webp/photo-1780080019323-20a5fb128906.webp"
            alt="A blue house with a white porch"
            data-fallback="assets/images/webp/placeholder.webp"
          />
        </div>
        <div class="card">
          <h1 style="font-size: 2.4rem">Welcome back</h1>
          <form
            data-validate
            data-ok="Details look valid. Opening your demo dashboard (no real sign-in happens)."
            novalidate
            style="margin-top: 1.5rem"
          >
            <fieldset class="roles">
              <legend style="font-weight: 700; margin-bottom: 0.4rem">Sign in as</legend>
              <label>
                <input type="radio" name="role" data-go="public-dashboard.html" checked />
                Buyer or renter
              </label>
              <label>
                <input type="radio" name="role" data-go="admin-dashboard.html" />
                Agency admin
              </label>
            </fieldset>
            <div class="field">
              <label for="em">Email</label>
              <input id="em" type="email" required data-v="email" autocomplete="email" />
              <p class="err" id="em-err" role="alert"></p>
            </div>
            <div class="field">
              <label for="pw">Password</label>
              <div class="pw">
                <input
                  id="pw"
                  type="password"
                  required
                  data-v="password"
                  autocomplete="current-password"
                />
                <button
                  type="button"
                  class="pw-toggle"
                  data-target="pw"
                  aria-pressed="false"
                  aria-label="Show password"
                >
                  Show
                </button>
              </div>
              <p class="err" id="pw-err" role="alert"></p>
            </div>
            <button class="btn btn-primary" type="submit">Log in</button>
            <p class="form-ok" role="status" hidden></p>
          </form>
          <a class="link-btn" href="404.html">
            Forgot password?
          </a>
          <p style="margin-top: 1rem">
            New here?
            <a href="create-account.html"><strong>Create an account</strong></a>
          </p>
        </div>
      </section>
    </main>
    <!-- Footer: built by js/main.js -->
    <footer id="site-foot"></footer>
    <!-- Scripts: libraries first, then site code -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
    <script src="js/main.js"></script>
    <script src="js/animations.js"></script>
    <script src="js/validation.js"></script>
  </body>
</html>
